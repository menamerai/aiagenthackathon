general:
  use_uvloop: true
  logging:
    console:
      _type: console
      level: INFO

  front_end:
    _type: fastapi

llms:
  reasoning_llm:
    _type: nim
    model_name: nvidia/llama-3.1-nemotron-70b-instruct
    temperature: 0.1
    max_tokens: 2000
    api_key: ${NVIDIA_API_KEY}
  
  translation_llm:
    _type: nim
    model_name: meta/llama-3.1-405b-instruct
    temperature: 0.0
    max_tokens: 4000
    api_key: ${NVIDIA_API_KEY}
  
  analysis_llm:
    _type: nim
    model_name: nvidia/llama-3.1-nemotron-70b-instruct
    temperature: 0.2
    max_tokens: 3000
    api_key: ${NVIDIA_API_KEY}

functions:
  english_news_search:
    _type: tavily_internet_search
    api_key: ${TAVILY_API_KEY}
  
  chinese_news_search:
    _type: tavily_internet_search  
    api_key: ${TAVILY_API_KEY}
  
  english_news_agent:
    _type: tool_calling_agent
    tool_names:
      - english_news_search
    llm_name: reasoning_llm
    verbose: true
    handle_tool_errors: true
    description: "Gathers English-language news from global sources"
  
  chinese_news_agent:
    _type: tool_calling_agent
    tool_names:
      - chinese_news_search
    llm_name: translation_llm
    verbose: true
    handle_tool_errors: true
    description: "Gathers Chinese-language news and provides translations"
  
  analysis_agent:
    _type: tool_calling_agent
    tool_names: []
    llm_name: analysis_llm
    verbose: true
    description: "Analyzes and compares perspectives from different sources"
  
  synthesis_agent:
    _type: tool_calling_agent
    tool_names: []
    llm_name: reasoning_llm
    verbose: true
    description: "Creates comprehensive multi-perspective summaries"

workflow:
  _type: global_news_room
  english_agent: english_news_agent
  chinese_agent: chinese_news_agent
  analysis_agent: analysis_agent
  synthesis_agent: synthesis_agent 