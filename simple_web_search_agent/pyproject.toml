[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 64", "setuptools-scm>=8"]

[tool.setuptools_scm]
root = ".."

[project]
name = "aiq_simple_web_search_agent"
dynamic = ["version"]
dependencies = [
  "aiqtoolkit[langchain]~=1.2",
  "aiqtoolkit[telemetry]~=1.2",
  "faiss-cpu==1.9.0",
  "requests>=2.25.0",
  "beautifulsoup4>=4.10.0",
]
requires-python = ">=3.11,<3.13"
description = "Simple Web Search Agent using NVIDIA NIM and LLaMA 70B"
keywords = ["ai", "web search", "agents", "nvidia", "llama"]
classifiers = ["Programming Language :: Python"]

[tool.uv.sources]
aiqtoolkit = { path = "..", editable = true }

[project.entry-points.'aiq.components']
aiq_simple_web_search_agent = "aiq_simple_web_search_agent.register" 